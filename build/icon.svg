<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2348"/>
      <stop offset=".55" stop-color="#141026"/>
      <stop offset="1" stop-color="#07060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="46%">
      <stop offset="0" stop-color="#8f7cff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#5b46d6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5b46d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1=".15" y1=".05" x2=".85" y2=".95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#efe9ff"/>
      <stop offset=".62" stop-color="#b9a8ff"/>
      <stop offset=".82" stop-color="#7fd6f5"/>
      <stop offset="1" stop-color="#f3b4e8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".75" stop-color="#9d8cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="sq"><path d="M512 64c260 0 340 0 394 54s54 134 54 394 0 340-54 394-134 54-394 54-340 0-394-54S64 772 64 512s0-340 54-394S252 64 512 64z"/></clipPath>
  </defs>
  <!-- squircle body -->
  <path d="M512 64c260 0 340 0 394 54s54 134 54 394 0 340-54 394-134 54-394 54-340 0-394-54S64 772 64 512s0-340 54-394S252 64 512 64z" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <circle cx="512" cy="560" r="420" fill="url(#glow)"/>
    <!-- star glow -->
    <path d="M512 196C530 390 594 470 790 512 594 554 530 634 512 828 494 634 430 554 234 512 430 470 494 390 512 196Z" fill="#a593ff" opacity=".85" filter="url(#soft)"/>
    <!-- star -->
    <path d="M512 196C530 390 594 470 790 512 594 554 530 634 512 828 494 634 430 554 234 512 430 470 494 390 512 196Z" fill="url(#star)"/>
    <!-- star facet highlight -->
    <path d="M512 196C530 390 594 470 790 512 600 520 540 470 512 196Z" fill="#ffffff" opacity=".35"/>
    <!-- small companion sparkle -->
    <path d="M742 236C747 282 762 298 808 304 762 310 747 326 742 372 737 326 722 310 676 304 722 298 737 282 742 236Z" fill="#ffffff" opacity=".9"/>
    <!-- glass gloss -->
    <path d="M64 64h896v340C760 330 600 300 512 300S264 330 64 404Z" fill="url(#gloss)"/>
  </g>
  <!-- rim -->
  <path d="M512 70c258 0 338 0 390 52s52 132 52 390 0 338-52 390-132 52-390 52-338 0-390-52S70 770 70 512s0-338 52-390S254 70 512 70z" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
